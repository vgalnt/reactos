[Operating Systems]
Setup_Halaacpi="Setup ACPI APIC UP (halaacpi.dll)"
Setup_Com_Halaacpi="Setup (Debug COM) (halaacpi.dll)"
Setup_Com+_Kd0_Halaacpi="Setup (Debug+ COM + KD0) (halaacpi.dll)"
Setup_Net_Halaacpi="Setup (Debug NET) (halaacpi.dll)"
Setup_Net+_Kd0_Halaacpi="Setup (Debug+ NET + KD0) (halaacpi.dll)"
Setup_LogFile_Halaacpi="Setup (Debug Log file) (halaacpi.dll)"
