[Setup_Halaacpi]
BootType=ReactOSSetup
Options=/NOGUIBOOT /FIRSTCHANCE /HAL=halaacpi.dll

[Setup_Com_Halaacpi]
BootType=ReactOSSetup
Options=/NOGUIBOOT /DEBUG /DEBUGPORT=COM1 /BAUDRATE=115200 /SOS /FIRSTCHANCE /HAL=halaacpi.dll

[Setup_Com+_Kd0_Halaacpi]
BootType=ReactOSSetup
Options=/NOGUIBOOT /DEBUG /DEBUGPORT=COM1 /BAUDRATE=115200 /DEBUGKD0=COMKD0-COM1-115200,SCREENKD0,FILEKD0 /ROS_DBG_FULL /SOS /FIRSTCHANCE /HAL=halaacpi.dll

[Setup_Net_Halaacpi]
BootType=ReactOSSetup
Options=/NOGUIBOOT /DEBUG /DEBUGPORT=NET /W2003 /HOST_IP=10.0.5.5 /HOST_PORT=50000 /ENCRYPTION_KEY=make.reactos.great.always /CPUFREQ=3000 /TARGET_IP=10.0.5.4 /SOS /FIRSTCHANCE /HAL=halaacpi.dll

[Setup_Net+_Kd0_Halaacpi]
BootType=ReactOSSetup
Options=/NOGUIBOOT /DEBUG /DEBUGPORT=NET /W2003 /HOST_IP=10.0.5.5 /HOST_PORT=50000 /ENCRYPTION_KEY=make.reactos.great.always /CPUFREQ=3000 /TARGET_IP=10.0.5.4 /DEBUGKD0=COMKD0-COM1-115200,SCREENKD0,FILEKD0 /ROS_DBG_FULL /SOS /FIRSTCHANCE /HAL=halaacpi.dll

[Setup_LogFile_Halaacpi]
BootType=ReactOSSetup
Options=/NOGUIBOOT /DEBUG /DEBUGPORT=FILE /FIRSTCHANCE /SOS /HAL=halaacpi.dll

[Setup_LogFile+_Kd0_Halaacpi]
BootType=ReactOSSetup
