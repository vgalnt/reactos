[FREELOADER]
DefaultOS=LiveCD_Com_Halaacpi
TimeOut=5

[Display]
TitleText=ReactOS LiveCD
StatusBarColor=Cyan
StatusBarTextColor=Black
BackdropTextColor=White
BackdropColor=Blue
BackdropFillStyle=Medium
TitleBoxTextColor=White
TitleBoxColor=Red
MessageBoxTextColor=White
MessageBoxColor=Blue
MenuTextColor=Default
MenuColor=Black
TextColor=Default
SelectedTextColor=Black
SelectedColor=Default
ShowTime=No
MenuBox=No
CenterMenu=No
MinimalUI=Yes
TimeText=Seconds until highlighted choice will be started automatically:   

[Operating Systems]
LiveCD_Halaacpi="Live ACPI APIC UP (halaacpi.dll)"
LiveCD_Com_Halaacpi="Live (COM) (halaacpi.dll)"
LiveCD_Com_Kd0_Halaacpi="Live (COM + KD0) (halaacpi.dll)"
LiveCD_Net_Halaacpi="Live (NET) (halaacpi.dll)"
LiveCD_Net_Kd0_Halaacpi="Live (NET + KD0) (halaacpi.dll)"
LiveCD_Screen_Halaacpi="Live (Screen) (halaacpi.dll)"
LiveCD_Screen_Kd0_Halaacpi="Live (Screen + KD0) (halaacpi.dll)"
LiveCD_LogFile_Halaacpi="Live (Log file) (halaacpi.dll)"
LiveCD_LogFile_Kd0_Halaacpi="Live (Log file + KD0) (halaacpi.dll)"

[LiveCD]
BootType=Windows2003
SystemPath=\reactos
Options=/MININT

[LiveCD_Debug]
BootType=Windows2003
SystemPath=\reactos
Options=/DEBUG /DEBUGPORT=COM1 /BAUDRATE=115200 /SOS /MININT

[LiveCD_VBoxDebug]
BootType=Windows2003
SystemPath=\reactos
Options=/DEBUG /DEBUGPORT=VBOX /SOS /MININT

[LiveCD_Screen]
BootType=Windows2003
SystemPath=\reactos
Options=/DEBUG /DEBUGPORT=SCREEN /SOS /MININT

[LiveCD_LogFile]
BootType=Windows2003
SystemPath=\reactos
Options=/DEBUG /DEBUGPORT=FILE:\Device\HarddiskX\PartitionY\debug.log /SOS /MININT

[LiveCD_Halacpi]
BootType=Windows2003
SystemPath=\reactos
Options=/MININT /MININT /HAL=halacpi.dll

[LiveCD_Debug_Halacpi]
BootType=Windows2003
SystemPath=\reactos
Options=/DEBUG /DEBUGPORT=COM1 /BAUDRATE=115200 /SOS /MININT /HAL=halacpi.dll

[LiveCD_Screen_Halacpi]
