SystemPath=\reactos
Options=/DEBUG /DEBUGPORT=COM1 /BAUDRATE=115200 /DEBUGKD0=COMKD0-COM1-115200,SCREENKD0,FILEKD0 /SOS /MININT /HAL=halaacpi.dll

[LiveCD_Net_Halaacpi]
