SystemPath=\reactos
Options=/DEBUG /DEBUGPORT=SCREEN /SOS /MININT /HAL=halacpi.dll

[LiveCD_LogFile_Halacpi]
BootType=Windows2003
SystemPath=\reactos
Options=/DEBUG /DEBUGPORT=FILE:\ArcName\multi(0)disk(0)rdisk(0)partition(1)\debug.log /SOS /MININT /HAL=halacpi.dll

[LiveCD_Halaacpi]
BootType=Windows2003
SystemPath=\reactos
Options=/MININT /MININT /HAL=halaacpi.dll

