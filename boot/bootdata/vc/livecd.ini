SystemPath=\reactos
Options=/DEBUG /DEBUGPORT=NET /W2003 /HOST_IP=10.0.5.5 /HOST_PORT=50000 /ENCRYPTION_KEY=make.reactos.great.always /CPUFREQ=3000 /TARGET_IP=10.0.5.4 /SOS /MININT /HAL=halaacpi.dll

[LiveCD_Net_Kd0_Halaacpi]
