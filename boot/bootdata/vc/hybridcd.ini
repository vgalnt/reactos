[FREELOADER]
DefaultOS=Setup_LogFile+_Kd0_Halaacpi
TimeOut=10

[Display]
TitleText=ReactOS Hybrid-CD
StatusBarColor=Cyan
StatusBarTextColor=Black
BackdropTextColor=White
BackdropColor=Blue
BackdropFillStyle=Medium
TitleBoxTextColor=White
TitleBoxColor=Red
MessageBoxTextColor=White
MessageBoxColor=Blue
MenuTextColor=Default
MenuColor=Black
TextColor=Default
SelectedTextColor=Black
SelectedColor=Default
ShowTime=No
MenuBox=No
CenterMenu=No
MinimalUI=Yes
TimeText=Seconds until highlighted choice will be started automatically:   

[Operating Systems]
Setup_Halaacpi="Setup ACPI APIC UP (halaacpi.dll)"
Setup_Com+_Kd0_Halaacpi="Setup (Debug+ COM + KD0) (halaacpi.dll)"
Setup_Net+_Kd0_Halaacpi="Setup (Debug+ NET) (halaacpi.dll)"
Setup_LogFile+_Kd0_Halaacpi="Setup (Debug+ Log file + KD0) (halaacpi.dll)"

LiveCD_Halaacpi="Live ACPI APIC UP (halaacpi.dll)"
LiveCD_Com+_Kd0_Halaacpi="Live (Debug+ COM + KD0) (halaacpi.dll)"
LiveCD_Net+_Kd0_Halaacpi="Live (Debug+ NET + KD0) (halaacpi.dll)"
LiveCD_LogFile+_Kd0_Halaacpi="Live (Debug+ Log file + KD0) (halaacpi.dll)"

LiveCD_RamDisk_Halaacpi="LiveCD in RAM ACPI APIC UP (halaacpi.dll)"
LiveCD_RamDisk_Com+_Kd0_Halaacpi="LiveCD (Debug+ COM + KD0) in RAM (halaacpi.dll)"
LiveCD_RamDisk_Net+_Kd0_Halaacpi="LiveCD (Debug+ NET + KD0) in RAM (halaacpi.dll)"

[Setup_Halaacpi]
BootType=ReactOSSetup
SystemPath=\bootcd
Options=/NOGUIBOOT /FIRSTCHANCE /HAL=halaacpi.dll

[Setup_Com+_Kd0_Halaacpi]
BootType=ReactOSSetup
SystemPath=\bootcd
Options=/NOGUIBOOT /DEBUG /DEBUGPORT=COM1 /BAUDRATE=115200 /DEBUGKD0=COMKD0-COM1-115200,SCREENKD0,FILEKD0 /ROS_DBG_FULL /FIRSTCHANCE /HAL=halaacpi.dll

[Setup_Net+_Kd0_Halaacpi]
BootType=ReactOSSetup
SystemPath=\bootcd
Options=/NOGUIBOOT /DEBUG /DEBUGPORT=NET /W2003 /HOST_IP=10.0.5.5 /HOST_PORT=50000 /ENCRYPTION_KEY=make.reactos.great.always /CPUFREQ=3000 /TARGET_IP=10.0.5.4 /DEBUGKD0=COMKD0-COM1-115200,SCREENKD0,FILEKD0 /ROS_DBG_FULL /SOS /FIRSTCHANCE /HAL=halaacpi.dll

[Setup_LogFile+_Kd0_Halaacpi]
BootType=ReactOSSetup
SystemPath=\bootcd
Options=/NOGUIBOOT /DEBUG /DEBUGPORT=FILE /DEBUGKD0=COMKD0-COM1-115200,SCREENKD0,FILEKD0 /ROS_DBG_FULL /FIRSTCHANCE /SOS /HAL=halaacpi.dll

[LiveCD_Halaacpi]
BootType=Windows2003
SystemPath=\livecd\reactos
Options=/MININT /MININT /HAL=halaacpi.dll

[LiveCD_Com+_Kd0_Halaacpi]
